name: Daily Workload Tracker

on:
  schedule:
    # GitHub cron uses UTC. Run every 4 hours so same-day work appears sooner.
    - cron: "30 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-workload-tracker
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Generate 7-day activity chart
        env:
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
          METRICS_AUTHOR_EMAILS: chenjun441900@gmail.com
          METRICS_EXCLUDED_REPOSITORIES: ${{ github.repository }}
        run: |
          git pull --ff-only origin "${GITHUB_REF_NAME}"
          node generate.js

      - name: Commit chart
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workload-chart.svg
          if git diff --cached --quiet; then
            echo "No chart changes to commit."
            exit 0
          fi
          git commit -m "chore: update code activity"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
