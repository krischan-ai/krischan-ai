name: Daily Workload Tracker

on:
  push:
    branches:
      - main
    paths:
      - "generate.js"
      - "generate-languages.js"
      - "github-api.js"
      - "test/**"
      - "generate-repositories.js"
      - "generate-overview.js"
      - "generate-featured-projects.js"
      - "repository-rules.json"
      - "featured-projects.json"
      - ".github/workflows/metrics.yml"
  schedule:
    # Daily at 08:30 UTC+8.
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-workload-tracker
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Test GitHub API resilience
        run: node --test test/*.test.js

      - name: Generate activity metrics
        env:
          METRICS_RUN_CACHE: ${{ runner.temp }}/profile-metrics-${{ github.run_id }}-${{ github.run_attempt }}
          METRICS_MAX_RATE_WAIT_MS: "3600000"
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
          METRICS_AUTHOR_EMAILS: chenjun441900@gmail.com
          METRICS_EXCLUDED_REPOSITORIES: ${{ github.repository }}
          LANGUAGE_API_CONCURRENCY: "3"
          WORKLOAD_API_CONCURRENCY: "3"
          REPOSITORY_API_CONCURRENCY: "3"
          LANGUAGE_METRICS_DAYS: "180"
          LANGUAGE_FILE_CHANGE_CAP: "1000"
          REPOSITORY_METRICS_DAYS: "180"
          REPOSITORY_FILE_CHANGE_CAP: "1000"
        run: |
          trap 'rm -rf -- "$METRICS_RUN_CACHE"' EXIT
          git pull --ff-only origin "${GITHUB_REF_NAME}"
          node generate.js
          node generate-languages.js
          node generate-repositories.js
          node generate-overview.js
          node generate-featured-projects.js

      - name: Commit charts
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workload-chart.svg languages.svg repositories.svg overview.svg featured-projects.svg
          if git diff --cached --quiet; then
            echo "No chart changes to commit."
            exit 0
          fi
          git commit -m "chore: update development metrics"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
