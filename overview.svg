  .eyebrow { fill:#8b949e; font:600 10px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; letter-spacing:.8px }
  .value { fill:#f0f6fc; font:700 21px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif }
